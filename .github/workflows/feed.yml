name: Сборка ленты

on:
  schedule:
    - cron: '*/20 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Взять прошлую сборку (чтобы не переводить заново)
        run: |
          git fetch -q --depth 1 origin gh-pages && git show origin/gh-pages:feed.json > prev-feed.json || echo "прошлой сборки нет"

      - name: Собрать источники
        run: node scripts/build-feed.mjs

      - name: Опубликовать на GitHub Pages (ветка gh-pages)
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "otbor-bot"
          git config user.email "otbor-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Лента $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
